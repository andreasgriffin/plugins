[tool.poetry]
name = "notification-broadcaster"
version = "1.2.0"
description = "Sends notifications to adapters such as email, Telegram, NIP-17, CalDAV, and generic webhooks."
authors = [
    "andreasgriffin <andreasgriffin@proton.me>",
]

[tool.bitcoin_safe.plugin]
schema_version = "1"
display_name = "Notifications"
plugin_api_version = "1"
entrypoint = "notification_broadcaster/plugin_bundle.py"
bitcoin_safe_version = ">=2.2.2,<3.0.0"
provider = "Bitcoin Safe"

[tool.bitcoin_safe.plugin.btcpay]
product_id = "notifications"
